[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sh-fae"
version = "0.1.0"
description = "SH-FAE: Functional Autoencoder with Physical Constraints for Soil Hydraulic Inversion"
authors = [
    { name = "Yuhao Ren" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "pandas>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sh_fae*"]
