model:
  latent_dim: 64
  point_embed_dim: 64
  encoder_layers: 3
  encoder_heads: 4
  encoder_mlp_ratio: 2
  dropout: 0.0
  decoder_hidden_dim: 128
  decoder_layers: 3
  density_eps: 1.0e-6
  x_min: -1.0
  x_max: 8.0
  x_int_points: 512
  u_int_points: 512
  y_min: -12.0

batch:
  nc_swrc: 64
  nc_hcf: 64
  nq_swrc: 128
  nq_hcf: 128

loss:
  smooth_weight: 1.0e-5

training:
  data_path: data/swcc_hcf_50k.npz
  output_dir: outputs/ae_50k_lat64
  batch_size: 256
  max_steps: 100000
  lr_peak: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip_norm: 1.0
  log_every: 100
  progress_every: 100
  eval_every: 1000
  save_every: 5000
  seed: 42
  num_workers: 0
  device: auto
